[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-encoder"
version = "1.0.0"
description = "Inference-only scene-text visual style encoder"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.5.0",
  "torchvision==0.20.0",
  "timm==1.0.20",
  "Pillow==10.3.0",
  "numpy==1.24.4",
  "huggingface-hub==0.35.0",
  "safetensors==0.6.2",
]

[project.scripts]
opaque-encoder = "opaque_encoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
